server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asistencia}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        stringtype: unspecified
        options: -c TimeZone=America/Lima
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: America/Lima
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SMTP_SECURE:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
app:
  jwt-secret: ${JWT_SECRET}
  reset-secret: ${PASSWORD_RESET_SECRET:${JWT_SECRET}}
  cors-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  mail-from: ${MAIL_FROM:${SMTP_USER:}}
  face-threshold: ${FACE_MATCH_THRESHOLD:0.6}
  auto-close-ms: ${AUTO_CLOSE_MS:30000}
