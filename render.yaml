services:
  # Frontend React/Vite. Render sirve los archivos estaticos desde su CDN.
  - type: web
    name: asistencia-qr-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://asistencia-qr-api-nsz3.onrender.com/api

  # API Spring Boot. Docker usa el contexto raiz para copiar backend-spring.
  - type: web
    name: asistencia-qr-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: asistencia-qr-demo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: asistencia-qr-demo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: asistencia-qr-demo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: asistencia-qr-demo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: asistencia-qr-demo-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_RESET_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        fromService:
          name: asistencia-qr-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: asistencia-qr-demo-db
    databaseName: asistencia_demo
    user: asistencia_demo
    postgresMajorVersion: "18"
    plan: free
    region: virginia
